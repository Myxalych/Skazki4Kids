<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Responsive design for mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сказки для детей</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Сказки для детей</h1>
    <p>Добро пожаловать! Выберите рассказ из списка ниже.</p>

  <!-- Container for dynamic story cards -->
  <div id="stories-container" class="stories-grid"></div>
  <footer>
    <p>Сайт создан с помощью агента ChatGPT.</p>
  </footer>
  <!--
    Логика загрузки списка рассказов вынесена в js/stories.js, чтобы её можно

    изображение storyX.png, чтобы рассказ появился на главной.
  -->
  <script src="js/stories.js"></script>
  <script>
    Stories.loadStories();
  </script>
