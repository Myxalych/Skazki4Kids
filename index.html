<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1026">
  <meta name="description" content="Научно-фантастические сказки для детей: продолжающиеся истории про экипаж «Искры» в духе ранних Стругацких и Азимова.">
  <meta property="og:title" content="Сказки для детей">
  <meta property="og:description" content="Научно-фантастические сказки для детей, которые продолжаются каждую неделю.">
  <meta property="og:type" content="website">
  <title>Сказки для детей</title>
  <link rel="preload" as="fetch" href="stories.json" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-header__title">Сказки для детей</h1>
    <p class="site-header__subtitle">Добро пожаловать! Выберите рассказ из списка ниже.</p>
  </header>

  <main>
    <div id="stories-container" class="stories-grid" aria-busy="true" aria-live="polite">
      <!-- Скелетоны на время загрузки; заменяются карточками. -->
      <div class="story-card story-card--skeleton" aria-hidden="true"></div>
      <div class="story-card story-card--skeleton" aria-hidden="true"></div>
      <div class="story-card story-card--skeleton" aria-hidden="true"></div>
      <div class="story-card story-card--skeleton" aria-hidden="true"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Сайт создан с помощью агента ChatGPT.</p>
  </footer>

  <script src="js/stories.js"></script>
  <script>
    var container = document.getElementById('stories-container');
    Stories.loadStories().finally(function () {
      if (container) container.setAttribute('aria-busy', 'false');
    });
  </script>
</body>
</html>
