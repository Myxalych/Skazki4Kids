name: Еженедельный рассказ

on:
  schedule:
    - cron: '0 9 * * 5'  # Каждая пятница в 12:00 по Москве (09:00 UTC)
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install google-genai requests pillow

      - name: Генерация рассказа
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_story.py

      - name: Публикация
        run: |
          git config user.name "Сказочный Бот"
          git config user.email "bot@users.noreply.github.com"
          git add stories/ img/ stories.json
          git diff --cached --quiet || git commit -m "📖 Новый рассказ $(date +%d.%m.%Y)"
          git push
